<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="760" height="270" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#18212f">Monocular scale ambiguity: one image, infinitely many (size, distance) pairs</text>
  <line x1="40" y1="200" x2="740" y2="200" stroke="#5b6577" stroke-dasharray="5 4"/>
  <line x1="60" y1="160" x2="60" y2="200" stroke="#2f5fd0" stroke-width="5"/>
  <text x="22" y="226" fill="#2f5fd0" font-size="12">40 px tall</text>
  <text x="22" y="241" fill="#2f5fd0" font-size="12">in the image</text>
  <circle cx="140" cy="200" r="5" fill="#18212f"/>
  <!-- rays -->
  <line x1="140" y1="200" x2="740" y2="40" stroke="#c4561a" stroke-width="1.4"/>
  <!-- three objects all subtending same angle -->
  <line x1="290" y1="200" x2="290" y2="160" stroke="#0e7c74" stroke-width="6"/>
  <text x="250" y="226" fill="#0e7c74" font-size="12">dog 0.55 m</text>
  <text x="250" y="241" fill="#0e7c74" font-size="12">at 3.8 m</text>
  <line x1="475" y1="200" x2="475" y2="111" stroke="#7a3f8f" stroke-width="6"/>
  <text x="430" y="226" fill="#7a3f8f" font-size="12">child 1.2 m</text>
  <text x="430" y="241" fill="#7a3f8f" font-size="12">at 8.3 m</text>
  <line x1="690" y1="200" x2="690" y2="53" stroke="#18212f" stroke-width="6"/>
  <text x="630" y="226" fill="#18212f" font-size="12">adult 1.7 m</text>
  <text x="630" y="241" fill="#18212f" font-size="12">at 11.8 m</text>
  <text x="150" y="58" fill="#5b6577" font-size="12">Same pixel height ⇒ the image alone fixes only H/Z.</text>
  <text x="150" y="76" fill="#5b6577" font-size="12">Metric distance needs one extra known quantity:</text>
  <text x="150" y="94" fill="#5b6577" font-size="12">object size, camera height, baseline, or learned priors.</text>
</svg>
