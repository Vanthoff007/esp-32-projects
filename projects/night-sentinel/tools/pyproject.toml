[project]
name = "night-sentinel-tools"
version = "0.1.0"
description = "PC-side tools for Night Sentinel: snapshot capture, night-settings sweeps, YOLO reference detector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python<5",
    "pyserial>=3.5",
    "ultralytics>=8.4.143",
    "ziglang>=0.17.1",
]
